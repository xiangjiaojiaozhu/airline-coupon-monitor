name: Build CouponRadar EXE
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --windowed --name CouponRadar coupon_radar.py
      - uses: actions/upload-artifact@v4
        with:
          name: CouponRadar-exe
          path: dist/CouponRadar.exe
